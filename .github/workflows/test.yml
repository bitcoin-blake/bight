# Runs the page's decisions and the release checks (the version, the security policy against the node pin, the node's
# messages at the pin, read from bight.js), the page itself in headless Chromium with a fake node (test/smoke.mjs), the
# formatting, and that a code change bumped the version.
# Only a green run on main is deployed to GitHub Pages (the deploy job); after it, the published apps' node pins are compared.
# That comparison does not fail a release (the apps are released one after another, siblings first, so a pin bump is mixed
# for a few minutes by design): it warns, and the scheduled run, which only compares, fails while they still differ, and
# then opens (or adds to) an issue in this repository, closed again by the first scheduled run that passes.
name: test
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '47 * * * *'
permissions:
  contents: read
concurrency:
  # the hourly comparison in a group of its own: in the deploy's group it could take the place of a push run still
  # waiting there, and that push would never be deployed
  group: ${{ github.event_name == 'schedule' && 'pins-hourly' || format('pages-{0}', github.ref) }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: pins
        id: pins
        run: echo "node=$(grep -o 'blaketestnode@[0-9a-f]\{40\}' bight.js | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - name: the engine the policy names (its header and its subsidy rule are checked against the page's)
        id: schema
        run: echo "pin=$(grep -o 'bitcoin-desktop/schema@[0-9a-f]\{40\}' index.html | head -1 | cut -d@ -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with: { repository: bitcoin-blake/blaketestnode, ref: '${{ steps.pins.outputs.node }}', path: deps/blaketestnode, fetch-depth: 0 }
      - uses: actions/checkout@v5
        with: { repository: bitcoin-desktop/schema, ref: '${{ steps.schema.outputs.pin }}', path: deps/schema, fetch-depth: 0 }
      - run: npm test
        env:
          BLAKETESTNODE: ${{ github.workspace }}/deps/blaketestnode
          SCHEMA: ${{ github.workspace }}/deps/schema
      - name: formatting
        run: npx --yes prettier@3.3.3 --check bight.js bight-app.js theme.js lib test tools
      - name: version bumped with the code, and upwards
        run: |
          base="${{ github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=$(git rev-parse HEAD~1 2>/dev/null || true); fi
          [ -z "$base" ] || node tools/version-up.mjs "$base"
      - name: before deploying, the other apps on main pin this node, or one that reads the same storage layout
        # the four apps share this origin's node files: a node that writes another layout than the others read would make
        # them refuse the files (or need a wipe), so that is an error; another pin with the same layout is a warning
        run: |
          mine=$(grep -o 'blaketestnode@[0-9a-f]\{40\}' bight.js | head -1 | cut -d@ -f2)
          layout() { curl -fsSL "https://raw.githubusercontent.com/bitcoin-blake/blaketestnode/$1/browser/worker.js" | grep -o '^const LAYOUT = [0-9]*' | grep -o '[0-9]*$'; }
          want=$(layout "$mine")
          [ -n "$want" ] || { echo "::error::no LAYOUT in the node at $mine"; exit 1; }
          for app in reef winch hitch; do
            p=$(curl -fsSL "https://raw.githubusercontent.com/bitcoin-blake/$app/main/$app.js" | grep -o 'blaketestnode@[0-9a-f]\{40\}' | sort -u | cut -d@ -f2)
            [ "$(echo "$p" | grep -c .)" = 1 ] || { echo "::error::$app on main pins more or fewer than one node version"; exit 1; }
            [ "$p" = "$mine" ] && { echo "$app: $p (the same)"; continue; }
            l=$(layout "$p")
            if [ "$l" != "$want" ]; then echo "::error::$app pins $p (layout $l), this page $mine (layout $want): the shared files would be refused"; exit 1; fi
            echo "::warning::$app pins $p, this page $mine: the same layout ($l), but bump them together"
          done
      - name: the site to deploy, and every file it refers to is in it
        run: |
          node tools/site.mjs _site
      - uses: actions/upload-artifact@v5
        with: { name: site, path: _site, retention-days: 7 }
      - name: smoke (the page in headless Chromium, fake node)
        run: |
          npm i --no-save playwright-core@1.61.1
          npx playwright-core install --with-deps chromium-headless-shell
          node test/smoke.mjs
        env:
          CI: '1'
          BLAKETESTNODE: ${{ github.workspace }}/deps/blaketestnode
  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { name: site, path: _site }
      - uses: actions/upload-pages-artifact@v4
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v5
  pins:
    needs: deploy
    if: always() && (github.event_name == 'schedule' || needs.deploy.result == 'success')
    continue-on-error: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: the four published apps pin the same node (after a deploy, polled until it is served)
        run: |
          want=$(node -pe 'require("./version.json").version')
          [ "${{ github.event_name }}" = schedule ] || for i in $(seq 1 30); do
            got=$(curl -fsSL "https://bitcoin-blake.github.io/bight/version.json?nocache=$RANDOM" | node -pe 'JSON.parse(require("fs").readFileSync(0)).version' || true)
            [ "$got" = "$want" ] && break; sleep 10
          done
          if [ "${{ github.event_name }}" != schedule ] && [ "$got" != "$want" ]; then echo "::error::the deployed version.json is $got, not $want, after five minutes"; exit 1; fi
          declare -A pin
          for f in reef/reef.js bight/bight.js winch/winch.js hitch/hitch.js; do
            p=$(curl -fsSL "https://bitcoin-blake.github.io/$f?nocache=$RANDOM" | grep -o 'blaketestnode@[0-9a-f]\{40\}' | sort -u)
            echo "$f: $p"; pin[$f]=$p
            if [ "$(echo "$p" | grep -c .)" != 1 ]; then echo "::error::$f pins more or fewer than one node version"; exit 1; fi
          done
          if [ "$(printf '%s\n' "${pin[@]}" | sort -u | wc -l)" != 1 ]; then
            # after a deploy the apps are mixed for a few minutes by design (siblings first): a warning; hourly, an error
            if [ "${{ github.event_name }}" = schedule ]; then echo "::error::the apps pin different node versions"; exit 1; fi
            echo "::warning::the apps pin different node versions (expected for a few minutes while they are released one after another)"
          fi
  # the hourly comparison failed: an issue says so (one, added to while it goes on); the first one that passes closes it
  alert:
    needs: pins
    if: always() && github.event_name == 'schedule' && (needs.pins.result == 'failure' || needs.pins.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - name: open, add to or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.pins.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='The four apps pin different node versions (hourly check)'
          n=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ "$RESULT" = success ]; then
            [ -z "$n" ] || gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "The apps pin the same node again: $RUN"
          elif [ -n "$n" ]; then
            gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "Still differing: $RUN"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body "The hourly comparison of the published apps' node pins failed: $RUN. Release the apps that are behind (README, Releasing)."
          fi

